<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL Post Test - Gamma Edu</title>
<style>
  :root{
    --navy:#0f2942; --navy2:#173a5e; --gold:#c9a24b; --gold2:#e2c477;
    --bg:#f4f6f9; --card:#ffffff; --text:#1c2b3a; --muted:#5c6b7a;
    --green:#1e7a4c; --red:#c23b3b; --border:#dfe4ea;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .topbar{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.15);position:sticky;top:0;z-index:50;}
  .topbar h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.3px;}
  .topbar .badge{background:var(--gold);color:var(--navy);font-weight:700;padding:4px 10px;border-radius:20px;font-size:12px;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  /* LOGIN */
  .login-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:#fff;border-radius:16px;padding:40px 36px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(15,41,66,.15);border-top:5px solid var(--gold);}
  .login-box h2{margin-top:0;color:var(--navy);}
  .login-box p{color:var(--muted);font-size:14px;}
  .login-box input{width:100%;padding:11px 12px;margin:8px 0 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;}
  .login-box button{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;}
  .login-box button:hover{background:var(--navy2);}
  .login-err{color:var(--red);font-size:13px;min-height:18px;margin-top:-4px;}
  .lock-icon{width:52px;height:52px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;}
  /* NAV */
  .section-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .section-nav button{flex:1;min-width:140px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600;color:var(--navy);font-size:13px;transition:.15s;}
  .section-nav button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .section-nav button:hover:not(.active){background:#eef2f6;}
  .progress{font-size:12px;color:var(--muted);margin-top:4px;}
  h2.section-title{color:var(--navy);border-bottom:3px solid var(--gold);padding-bottom:8px;margin-top:0;}
  .part-title{color:var(--navy2);margin-top:26px;font-size:16px;border-left:4px solid var(--gold);padding-left:10px;}
  .directions{background:#fbf7ec;border:1px solid #eddfb8;border-radius:10px;padding:14px 16px;font-size:13.5px;color:#6b5a2a;margin:10px 0 18px;line-height:1.5;}
  audio{width:100%;margin:10px 0 4px;}
  .audio-box{background:#f0f4f9;border:1px dashed #b9c6d6;border-radius:10px;padding:14px;margin-bottom:16px;}
  .audio-box .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .q{border-bottom:1px solid var(--border);padding:16px 0;}
  .q:last-child{border-bottom:none;}
  .qnum{font-weight:700;color:var(--navy);margin-bottom:8px;}
  .qtext{margin-bottom:10px;line-height:1.55;}
  .opt{display:block;padding:9px 12px;margin:6px 0;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;font-size:14.5px;}
  .opt:hover{background:#f5f8fc;}
  .opt input{margin-right:10px;}
  .opt.selected{border-color:var(--navy2);background:#eaf1f8;}
  .passage{background:#fbfbf9;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:18px;line-height:1.7;font-size:14.5px;white-space:pre-line;max-height:340px;overflow-y:auto;}
  .passage-title{color:var(--navy);font-weight:700;margin-bottom:6px;}
  .submit-bar{position:sticky;bottom:0;background:linear-gradient(0deg,#fff 70%,rgba(255,255,255,0));padding:18px 0 6px;}
  .btn-submit{width:100%;padding:15px;background:var(--gold);color:var(--navy);border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(201,162,75,.4);}
  .btn-submit:hover{background:var(--gold2);}
  /* RESULTS */
  .score-hero{text-align:center;padding:26px;}
  .score-hero .big{font-size:52px;font-weight:800;color:var(--navy);}
  .score-hero .sub{color:var(--muted);font-size:14px;margin-top:4px;}
  .score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;}
  .score-tile{background:#f7f9fb;border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border);}
  .score-tile .n{font-size:22px;font-weight:700;color:var(--navy2);}
  .score-tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .notice{background:#fdf2f2;border:1px solid #f0c6c6;color:#8a2b2b;border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.6;margin:16px 0;}
  .notice.info{background:#eef5fb;border-color:#c6ddf0;color:#1c4a68;}
  .review-item{border-bottom:1px solid var(--border);padding:10px 0;font-size:13.5px;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
  .tag.correct{background:#e3f5e9;color:var(--green);}
  .tag.wrong{background:#fbeaea;color:var(--red);}
  .tag.na{background:#eef0f2;color:var(--muted);}
  details{margin-top:10px;}
  summary{cursor:pointer;color:var(--navy2);font-weight:600;font-size:13.5px;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 40px;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="lock-icon">🔒</div>
    <h2>TOEFL Post Test</h2>
    <p>Masukkan username dan password untuk membuka soal ujian.</p>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="off">
    <input type="password" id="loginPass" placeholder="Password" autocomplete="off">
    <div class="login-err" id="loginErr"></div>
    <button onclick="doLogin()">Masuk</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <h1>📘 TOEFL Post Test</h1>
    <span class="badge" id="topProgress">0 / 140 dijawab</span>
  </div>

  <div class="wrap">

    <div class="card" style="margin-bottom:16px;">
      <label for="pesertaName" style="display:block;font-weight:600;color:var(--navy);margin-bottom:6px;font-size:13.5px;">Nama Peserta (wajib diisi sebelum submit)</label>
      <input type="text" id="pesertaName" placeholder="Tulis nama lengkap Anda di sini" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14.5px;">
    </div>

    <div class="section-nav">
      <button class="active" onclick="showSection(0)" id="navbtn0">1. Listening</button>
      <button onclick="showSection(1)" id="navbtn1">2. Structure</button>
      <button onclick="showSection(2)" id="navbtn2">3. Reading</button>
    </div>

    <div id="sec0"></div>
    <div id="sec1" style="display:none;"></div>
    <div id="sec2" style="display:none;"></div>

    <div class="submit-bar">
      <button class="btn-submit" onclick="submitTest()">✅ Selesai &amp; Lihat Skor</button>
    </div>

    <div id="results"></div>

  </div>
  <footer>TOEFL Post Test &middot; dibuat untuk latihan mandiri &middot; Gamma Edu</footer>
</div>

wer": "D"}]}, {"title": "John James Audubon", "range": "11-19", "text": "John James Audubon, nineteenth-century artist and naturalist, is known as one of the foremost authorities on North American birds. Born in Les Cayes, Haiti, in 1785, Audubon was raised in France and studied art under French artist Jacques-Louis David. After settling on his father's Pennsylvania estate at the age of eighteen, he first began to study and paint birds.\n\nIn his young adulthood, Audubon undertook numerous enterprises, generally without a tremendous amount of success; at various times during his life he was involved in a mercantile business, a lumber and grist mill, a taxidermy business, and a school. His general mode of operating a business was to leave it either unattended or in the hands of a partner and take off on excursions through the wilds to paint the natural life that he saw. His business career came to an end in 1819 when he was jailed for debt and forced to file for bankruptcy.\n\nIt was at that time that Audubon began seriously to pursue the dream of publishing a collection of his paintings of birds. For the next six years he painted birds in their natural habitats while his wife worked as a teacher to support the family. His Birds of America, which included engravings of 435 of his colorful and lifelike water colors, was published in parts during the period from 1826 to 1838 in England. After the success of the English editions, American editions of his work were published in 1839, and his fame and fortune were ensured.", "questions": [{"num": 11, "prompt": "This passage is mainly about", "options": ["North American birds", "Audubon's route to success as a painter of birds", "the works that Audubon published", "Audubon's preference for travel in natural habitats"], "answer": "B"}, {"num": 12, "prompt": "The word \"foremost\" in line 1 is closest in meaning to", "options": ["prior", "leading", "first", "largest"], "answer": "B"}, {"num": 13, "prompt": "In the second paragraph, the author mainly discusses", "options": ["how Audubon developed his painting style", "Audubon's involvement in a mercantile business", "where Audubon went on his excursions", "Audubon's unsuccessful business practices"], "answer": "D"}, {"num": 14, "prompt": "The word \"mode\" in line 7 could best be replaced by", "options": ["method", "vogue", "average", "trend"], "answer": "A"}, {"num": 15, "prompt": "Audubon decided not to continue to pursue business when", "options": ["he was injured in an accident at a grist mill", "he decided to study art in France", "he was put in prison because he owed money", "he made enough money from his paintings"], "answer": "C"}, {"num": 16, "prompt": "The word \"pursue\" in line 11 is closest in meaning to", "options": ["imagine", "share", "follow", "deny"], "answer": "C"}, {"num": 17, "prompt": "According to the passage, Audubon's paintings", "options": ["were realistic portrayals", "used only black, white, and gray", "were done in oils", "depicted birds in cages"], "answer": "A"}, {"num": 18, "prompt": "The word \"support\" in line 13 could best be replaced by", "options": ["tolerate", "provide for", "side with", "fight for"], "answer": "B"}, {"num": 19, "prompt": "It can be inferred from the passage that after 1839 Audubon", "options": ["unsuccessfully tried to develop new businesses", "continued to be supported by his wife", "traveled to Europe", "became wealthy"], "answer": "D"}]}, {"title": "Schizophrenia", "range": "20-29", "text": "Schizophrenia is often confused with multiple personality disorder yet is quite distinct from it. Schizophrenia is one of the more common mental disorders, considerably more common than multiple personality disorder. The term \"schizophrenia\" is composed of roots which mean \"a splitting of the mind,\" but it does not refer to a division into separate and distinct personalities, as occurs in multiple personality disorder. Instead, schizophrenic behavior is generally characterized by illogi of Italy continued to prosper and expand. By 1918 there were twenty-four branches of the Bank of Italy, and by 1928 Giannini had acquired numerous other banks, including a Bank of America located in New York City. In 1930 he consolidated all the branches of the Bank of Italy, the Bank of America in New York City, and another Bank of America that he had formed in California into the Bank of America National Trust and Savings Association.\n\nA second major crisis for the bank occurred during the Great Depression of the 1930s. Although Giannini had already retired prior to the darkest days of the Depression, he became incensed when his successor began selling off banks during the bad economic times. Giannini resumed leadership of the bank at the age of sixty-two. Under Giannini's leadership, the bank weathered the storm of the Depression and subsequently moved into a phase of overseas development.", "questions": [{"num": 40, "prompt": "According to the passage, Giannini", "options": ["opened the Bank of America in 1904", "worked in a bank in Italy", "set up the Bank of America prior to setting up the Bank of Italy", "later changed the name of the Bank of Italy"], "answer": "D"}, {"num": 41, "prompt": "Where did Giannini open his first bank?", "options": ["In New York City", "In what used to be a bar", "On Washington Street Wharf", "On a makeshift desk"], "answer": "B"}, {"num": 42, "prompt": "According to the passage, which of the following is NOT true about the San Francisco earthquake?", "options": ["It happened in 1906.", "It occurred in the aftermath of a fire.", "It caused problems for Giannini's bank.", "It was a tremendous earthquake."], "answer": "B"}, {"num": 43, "prompt": "The word \"raging\" in line 8 could best be replaced by", "options": ["angered", "localized", "intense", "feeble"], "answer": "C"}, {"num": 44, "prompt": "It can be inferred from the passage that Giannini used crates of oranges after the earthquake", "options": ["to hide the gold", "to fill <script>

const USERNAME = "gamma_edu";

const answers = {}; // key: "L-1", "S-1", "WE-16", "R-1" etc -> selected letter/index

function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  if(u === USERNAME && p === PASSWORD){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildAll();
  } else {
    err.textContent = "Username atau password salah.";

}
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function letterFromIndex(i){ return "ABCD"[i]; }

function renderOptions(qkey, options, groupName){
  let html = '<div class="opts">';
  options.forEach((opt, i)=>{
    const letter = letterFromIndex(i);
    const id = qkey+"_"+letter;
    html += `<label class="opt" id="lbl_${id}">
      <input type="radio" name="${groupName}" value="${letter}" onchange="selectAnswer('${qkey}','${letter}','${id}','${groupName}')">
      <b>(${letter})</b> ${opt}
    </label>`;
  });
  html += '</div>';
  return html;
}

function selectAnswer(qkey, letter, id, groupName){
  answers[qkey] = letter;
  document.querySelectorAll(`input[name="${groupName}"]`).forEach(inp=>{
    document.getElementById('lbl_'+qkey+'_'+inp.value).classList.remove('selected');
  });
  document.getElementById(id).classList.add('selected');
  updateProgress();
}

function updateProgress(){
  const total = 140;

}

      <div class="qtext">${item.sentence}</div>
      ${renderOptions(qkey, item.options, "grp_"+qkey)}
    </div>`;
  });

  html += `<h3 class="part-title">Written Expression (Q16–40)</h3>
    <div class="directions">Setiap kalimat memiliki satu bagian yang salah secara gramatikal. Pilih bagian (A/B/C/D) yang harus diperbaiki.<br>
    <em>Catatan: karena dokumen sumber hasil OCR kehilangan tanda garis bawah asli pada 4 pilihan, batas frasa (A)(B)(C)(D) di bawah ini disusun ulang secara wajar oleh sistem — namun frasa yang salah secara gramatikal tetap diverifikasi langsung dari teks kalimat.</em></div>`;

  DATA.structure.written_expression.forEach(item=>{
    const qkey = "WE-"+item.num;
    html += `<div class="q">
      <div class="qnum">Question ${item.num}</div>
      <div class="qtext">${item.display}</div>
      ${renderOptions(qkey, item.options, "grp_"+qkey)}
    </div>`;
  });

  html += `</div>`;
  document.getElementById('sec1').innerHTML = html;
}

// ---------- SECTION 3: READING ----------
function buildReading(){
  let html = `<div class="card">
    <h2 class="section-title">Section 3 — Reading Comprehension</h2>
    <div class="directions">Baca setiap bacaan, lalu jawab pertanyaan berdasarkan informasi yang tersurat maupun tersirat dalam teks.</div>`;

  DATA.reading.forEach(p=>{
    html += `<h3 class="part-title">${p.title} (Q${p.range})</h3>
      <div class="passage"><div class="passage-title">${p.title}</div>${p.text}</div>`;
    p.questions.forEach(item=>{
      const qkey = "R-"+item.num+"-"+p.title.replace(/\s+/g,'');
      html += `<div class="q">
        <div class="qnum">Question ${item.num}</div>
        <div class="qtext">${item.prompt}</div>
        ${renderOptions(qkey, item.options, "grp_"+qkey)}
      </div>`;
    });
  });

  html += `</div>`;
  document.getElementById('sec2').innerHTML = html;
}

function buildAll(){
  buildListening();
  buildStructure();
  buildReading();
  updateProgress();
}

function showSection(i){
  [0,1,2].forEach(n=>{
    document.getElementById('sec'+n).style.display = (n===i)?'block':'none';
    document.getElementById('navbtn'+n).classList.toggle('active', n===i);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

// ---------- SCORING ----------
let lastResultsPayload = null;

function submitTest(){
  const pesertaName = document.getElementById('pesertaName').value.trim();
  if(!pesertaName){
    alert('Mohon isi Nama Peserta terlebih dahulu sebelum submit.');
    document.getElementById('pesertaName').focus();
    return;
  }

  let structCorrect=0, structTotal=0;
  let weCorrect=0, weTotal=0;
  let readCorrect=0, readTotal=0;
  let listenAnswered=0, listenTotal=0;

  let structReview = [];
  let weReview = [];
  let readReview = [];

  DATA.structure.structure.forEach(item=>{
    structTotal++;
    const qkey="S-"+item.num;
    const given = answers[qkey];
    const ok = given === item.answer;
    if(ok) structCorrect++;
    structReview.push({num:item.num, given, correct:item.answer, ok, text:item.sentence});
  });

  DATA.structure.written_expression.forEach(item=>{
    weTotal++;
    const qkey="WE-"+item.num;
    const given = answers[qkey];
    const ok = given === item.answer;
    if(ok) weCorrect++;
    weReview.push({num:item.num, given, correct:item.answer, ok, phrase:item.error_phrase, correction:item.correction, sentence:item.display});
  });

  DATA.reading.forEach(p=>{
    p.questions.forEach(item=>{
      readTotal++;
      const qkey = "R-"+item.num+"-"+p.title.replace(/\s+/g,'');
      const given = answers[qkey];
      const ok = given === item.answer;
      if(ok) readCorrect++;
      readReview.push({num:item.num, given, correct:item.answer, ok, prompt:item.prompt, passage:p.title});
    });
  });

  ['partA','partB','partC'].forEach(pk=>{
    DATA.listening[pk].items.forEach(item=>{
      listenTotal++;
      if(answers["L-"+item.num]) listenAnswered++;
    });
  });

  const gradedTotal = structTotal + weTotal + readTotal;
  const gradedCorrect = structCorrect + weCorrect + readCorrect;
  const pct = Math.round((gradedCorrect/gradedTotal)*1000)/10;

  let html = `<div class="card">
    <div class="score-hero">
      <div class="sub">SKOR ANDA (Structure + Reading — bagian yang tervalidasi otomatis)</div>
      <div class="big">${gradedCorrect} / ${gradedTotal}</div>
      <div class="sub">${pct}% benar</div>
      <div class="score-grid">
        <div class="score-tile"><div class="n">${structCorrect}/${structTotal}</div><div class="l">Structure</div></div>
        <div class="score-tile"><div class="n">${weCorrect}/${weTotal}</div><div class="l">Written Expr.</div></div>
        <div class="score-tile"><div class="n">${readCorrect}/${readTotal}</div><div class="l">Reading</div></div>
      </div>
    </div>

    <div class="notice">
      <b>⚠️ Listening (Section 1) — ${listenAnswered}/${listenTotal} soal dijawab, TIDAK ikut dihitung skor otomatis.</b><br>
      Kunci jawaban Listening tidak dapat saya verifikasi secara jujur: soal ini bergantung sepenuhnya pada isi percakapan/monolog di file audio (Part_A.mpeg, Part_B.mpeg, Part_C.mpeg — TOEFL Listening Post Test 2), dan sistem ini tidak memiliki kemampuan transkripsi audio (speech-to-text) untuk memverifikasi jawaban yang benar tanpa risiko salah. Daripada mengarang kunci jawaban, bagian ini disajikan sebagai <i>latihan mendengarkan mandiri</i> — silakan cocokkan dengan kunci jawaban resmi dari sumber buku/dokumen asli jika tersedia. [Keyakinan: tidak dapat dinilai]
    </div>

    <div class="notice info">
      <b>ℹ️ Catatan tentang Written Expression (Q16–40):</b> Dokumen sumber (hasil OCR) tidak mempertahankan posisi 4 garis bawah asli — hanya frasa yang salah secara gramatikal yang berhasil diekstrak dengan jelas. Pilihan (A)(B)(C)(D) pada bagian ini disusun ulang oleh sistem berdasarkan segmentasi kalimat yang wajar, dengan frasa yang salah (dan koreksinya) diverifikasi langsung melalui analisis tata bahasa Inggris. [Keyakinan Tinggi] untuk identifikasi kesalahan &amp; koreksi; [Keyakinan Sedang] untuk posisi huruf (A/B/C/D) karena rekonstruksi format.
    </div>

    <div class="notice info">
      <b>📥 Langkah selanjutnya:</b> Klik tombol di bawah untuk mengunduh file jawaban dan skor Anda, lalu kirimkan file tersebut ke <b>geoteknoboost@gmail.com</b> sebagai bukti penyelesaian post test.
    </div>

    <button class="btn-submit" onclick="downloadResults()">📥 Download Jawaban &amp; Skor</button>
  </div>
  `;

  lastResultsPayload = {
    pesertaName, tanggal: new Date().toLocaleString('id-ID'),
    gradedCorrect, gradedTotal, pct,
    structCorrect, structTotal, weCorrect, weTotal, readCorrect, readTotal,
    listenAnswered, listenTotal,
    structReview, weReview, readReview
  };

  document.getElementById('results').innerHTML = html;
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function downloadResults(){
  if(!lastResultsPayload) return;
  const d = lastResultsPayload;

  let txt = '';
  txt += `TOEFL POST TEST - HASIL & JAWABAN\n`;
  txt += `================================\n`;
  txt += `Nama Peserta : ${d.pesertaName}\n`;
  txt += `Tanggal      : ${d.tanggal}\n\n`;
  txt += `SKOR (Structure + Reading, tervalidasi otomatis): ${d.gradedCorrect} / ${d.gradedTotal} (${d.pct}%)\n`;
  txt += `  - Structure          : ${d.structCorrect} / ${d.structTotal}\n`;
  txt += `  - Written Expression : ${d.weCorrect} / ${d.weTotal}\n`;
  txt += `  - Reading            : ${d.readCorrect} / ${d.readTotal}\n`;
  txt += `  - Listening (belum divalidasi otomatis): ${d.listenAnswered} / ${d.listenTotal} soal dijawab\n\n`;

  txt += `--- JAWABAN STRUCTURE (Q1-15) ---\n`;
  d.structReview.forEach(it=>{ txt += `No. ${it.num}: ${it.given ? it.given : '(belum dijawab)'}\n`; });

  txt += `\n--- JAWABAN WRITTEN EXPRESSION (Q16-40) ---\n`;
  d.weReview.forEach(it=>{ txt += `No. ${it.num}: ${it.given ? it.given : '(belum dijawab)'}\n`; });

  txt += `\n--- JAWABAN READING COMPREHENSION (Q1-50) ---\n`;
  d.readReview.forEach(it=>{ txt += `No. ${it.num} (${it.passage}): ${it.given ? it.given : '(belum dijawab)'}\n`; });

  txt += `\n--------------------------------\n`;
  txt += `Silakan kirimkan file ini ke geoteknoboost@gmail.com sebagai bukti penyelesaian post test.\n`;

  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (d.pesertaName || 'peserta').replace(/[^a-zA-Z0-9]+/g,'_');
  a.href = url;
  a.download = `TOEFL_PostTest_${safeName}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
